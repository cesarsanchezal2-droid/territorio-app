<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Territorio App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f0f2f5; }

    #header {
      background: #1a1a2e; color: white;
      padding: 14px 24px; display: flex;
      align-items: center; justify-content: space-between;
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 1000; height: 52px;
    }
    #header h1 { font-size: 16px; font-weight: 500; }
    #header span { font-size: 12px; opacity: 0.6; }
    #ultima-actualizacion { font-size: 11px; color: #1D9E75; }

    .contenido { margin-top: 52px; padding: 16px; }

    /* MÉTRICAS */
    .metricas { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
    @media(max-width:600px){ .metricas { grid-template-columns: repeat(2,1fr); } }
    .metrica {
      background: white; border-radius: 12px;
      padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .metrica-label { font-size: 11px; color: #999; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .metrica-valor { font-size: 28px; font-weight: 600; color: #1a1a2e; }
    .metrica-valor.verde { color: #1D9E75; }
    .metrica-valor.naranja { color: #e67e22; }
    .metrica-valor.rojo { color: #e74c3c; }

    /* DOS COLUMNAS */
    .dos-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    @media(max-width:700px){ .dos-col { grid-template-columns: 1fr; } }

    .panel {
      background: white; border-radius: 12px;
      padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .panel h2 { font-size: 13px; font-weight: 600; color: #1a1a2e; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.05em; }

    /* MAPA */
    #mapa { width: 100%; height: 320px; border-radius: 8px; overflow: hidden; }

    /* BARRAS */
    .barra-item { margin-bottom: 12px; }
    .barra-label { display: flex; justify-content: space-between; font-size: 12px; color: #555; margin-bottom: 4px; }
    .barra-wrap { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
    .barra-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    .fill-verde { background: #1D9E75; }
    .fill-naranja { background: #e67e22; }
    .fill-rojo { background: #e74c3c; }
    .fill-gris { background: #95a5a6; }
    .fill-agua { background: #3498db; }
    .fill-calles { background: #9b59b6; }
    .fill-alumbrado { background: #f39c12; }

    /* LISTA REPORTES */
    .reporte-item {
      padding: 10px 12px; border-radius: 8px;
      background: #fff8f0; border-left: 3px solid #e67e22;
      margin-bottom: 8px; font-size: 12px; color: #555; line-height: 1.5;
    }
    .reporte-item.urgente { background: #fff0f0; border-color: #e74c3c; }
    .reporte-hora { font-size: 10px; color: #aaa; margin-top: 4px; }
    .sin-reportes { font-size: 13px; color: #aaa; text-align: center; padding: 20px; }

    /* TABLA */
    .tabla-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; padding: 8px 10px; background: #f8f8f8; color: #999; font-weight: 500; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }
    td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; color: #444; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
    .badge-bien { background: #e8f7f2; color: #1D9E75; }
    .badge-regular { background: #fef3e2; color: #e67e22; }
    .badge-mal { background: #fde8e8; color: #e74c3c; }
    .badge-noopina { background: #f0f0f0; color: #999; }
    .badge-vacio { background: #f0f0f0; color: #bbb; }

    /* BOTÓN ACTUALIZAR */
    #btn-actualizar {
      position: fixed; bottom: 20px; right: 20px;
      background: #1D9E75; color: white; border: none;
      border-radius: 25px; padding: 12px 20px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      box-shadow: 0 4px 12px rgba(29,158,117,0.4); z-index: 1000;
    }
  </style>
</head>
<body>

<div id="header">
  <h1>📊 Dashboard — Sección 1575</h1>
  <span id="ultima-actualizacion">Cargando...</span>
</div>

<div class="contenido">

  <!-- MÉTRICAS -->
  <div class="metricas">
    <div class="metrica">
      <p class="metrica-label">Total visitas</p>
      <p class="metrica-valor" id="m-total">—</p>
    </div>
    <div class="metrica">
      <p class="metrica-label">Satisfacción positiva</p>
      <p class="metrica-valor verde" id="m-bien">—</p>
    </div>
    <div class="metrica">
      <p class="metrica-label">Inconformes</p>
      <p class="metrica-valor rojo" id="m-mal">—</p>
    </div>
    <div class="metrica">
      <p class="metrica-label">Reportes urgentes</p>
      <p class="metrica-valor naranja" id="m-reportes">—</p>
    </div>
  </div>

  <!-- MAPA + GOBIERNO -->
  <div class="dos-col">
    <div class="panel">
      <h2>Mapa de visitas</h2>
      <div id="mapa"></div>
    </div>
    <div class="panel">
      <h2>Evaluación del gobierno</h2>
      <div id="barras-gobierno"></div>

      <h2 style="margin-top:20px;">Problemas más mencionados</h2>
      <div id="barras-problemas"></div>
    </div>
  </div>

  <!-- REPORTES + TABLA -->
  <div class="dos-col">
    <div class="panel">
      <h2>Reportes ciudadanos</h2>
      <div id="lista-reportes"></div>
    </div>
    <div class="panel">
      <h2>Últimas visitas</h2>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Hora</th>
              <th>Gobierno</th>
              <th>Agua</th>
              <th>Calles</th>
            </tr>
          </thead>
          <tbody id="tabla-visitas"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<button id="btn-actualizar" onclick="cargarDatos()">↻ Actualizar</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const SUPABASE_URL = 'https://cwoysuzqiaxdfcadvwog.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Hp_OvapXSjGbQ485vB1hpg_aqj5yOSm';

  // ── MAPA ─────────────────────────────────────
  const map = L.map('mapa').setView([25.715, -100.395], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  const geojsonData = {"type":"FeatureCollection","features":[{"type":"Feature","geometry":{"type":"Polygon","coordinates":[[[-100.38886428668205,25.72081023594067],[-100.3890993568809,25.7210150793779],[-100.38926752870469,25.721083736800608],[-100.38935883305182,25.721212293841212],[-100.39050709488606,25.72171639632561],[-100.39109200778488,25.721973175781507],[-100.39205468319106,25.722395787043077],[-100.39214940497139,25.722420890128692],[-100.39266074018549,25.722556402489218],[-100.39316363399276,25.722736216184142],[-100.39336584142995,25.722808516414062],[-100.39410393166229,25.722738591709955],[-100.39424297473457,25.72275944886997],[-100.39487102544938,25.72270536488857],[-100.39524200281795,25.722661135896924],[-100.39557677664777,25.722541016192178],[-100.39569731825134,25.72249776459288],[-100.39586441640071,25.722473976391726],[-100.39622688702256,25.722308696273707],[-100.39648570505196,25.722190679065235],[-100.39654283185463,25.722181490757098],[-100.39673018530695,25.72215135655306],[-100.39690974431173,25.722145937341587],[-100.39728657247991,25.722253261940306],[-100.3973221242592,25.72226723837036],[-100.39778211194319,25.722448071700637],[-100.3982137668922,25.722617764829078],[-100.39864114301106,25.722785774086155],[-100.39908458611214,25.722960097703524],[-100.39971204573827,25.723206757525606],[-100.39978420515469,25.723235123774963],[-100.40015361952135,25.723461364164407],[-100.40034944927528,25.723581295406206],[-100.40066581746859,25.723775046433836],[-100.40077105237754,25.723839494369514],[-100.40247362139988,25.72501403758473],[-100.40264780705536,25.72513419972026],[-100.40286261164803,25.724531712115695],[-100.40296399308508,25.724247353651787],[-100.40307991723017,25.724037305145785],[-100.40319584098187,25.723827256558636],[-100.40336286186414,25.723624349181115],[-100.40339362995073,25.723586970098797],[-100.40357016311222,25.723372505518462],[-100.40389315907194,25.723421369350614],[-100.40424272417697,25.723632382815687],[-100.40507687276882,25.72444158022218],[-100.40837267091119,25.720393828224935],[-100.41598034425323,25.70890199998582],[-100.41525704956992,25.70861877776303],[-100.41470965760335,25.708537428721797],[-100.41401771677096,25.708177080059087],[-100.41337074314308,25.707754200203574],[-100.41185031775699,25.707592623563382],[-100.41147541136885,25.707229384325395],[-100.41142407175393,25.707179642151765],[-100.41140830619746,25.707156724574634],[-100.41127145152163,25.70695778552113],[-100.41099753249708,25.706559600130326],[-100.41081452002203,25.70614596792159],[-100.41038781076874,25.705401688166106],[-100.41014464068881,25.705216226366122],[-100.40987978818339,25.705012836467862],[-100.40961635858257,25.7047945176892],[-100.40935292993935,25.70457619838762],[-100.39692795120527,25.717045850627738],[-100.39687325110499,25.717247957536717],[-100.39638058541074,25.717317383396278],[-100.39610453541322,25.71736939211128],[-100.39605222417487,25.717405944879403],[-100.39560725994053,25.717716864480497],[-100.39520643299247,25.717996940575713],[-100.39502726871766,25.7180897891467],[-100.3947194137898,25.71834153500947],[-100.39449163376382,25.718527799197474],[-100.39443757424613,25.718205552480764],[-100.39370015123923,25.71787465387522],[-100.3938228517868,25.71813618687844],[-100.39394555289488,25.71839771974696],[-100.39360054485289,25.71831988173122],[-100.39321306818943,25.718243011767594],[-100.39312577263995,25.718225693391062],[-100.39112505299593,25.71860552798048],[-100.39103983367167,25.718774004828397],[-100.3909497063728,25.718845558811175],[-100.39068562107342,25.718902123431217],[-100.3904403414282,25.719051251704293],[-100.38993548483032,25.719358198488855],[-100.38944405603186,25.71965697819993],[-100.38895262473103,25.719955756342763],[-100.38891476741816,25.71997877252956],[-100.38882047995568,25.72002786782068],[-100.38873118159611,25.72011684057208],[-100.38875837381504,25.720431799910404],[-100.3887643732654,25.720587429097478],[-100.38886428668205,25.72081023594067]]]},"properties":{"SECCION":1575}}]};

  const capa = L.geoJSON(geojsonData, {
    style: { color: '#1D9E75', weight: 2, fillColor: '#1D9E75', fillOpacity: 0.1 }
  }).addTo(map);
  map.fitBounds(capa.getBounds());

  let marcadores = [];

  // ── CARGAR DATOS ─────────────────────────────
  async function cargarDatos() {
    document.getElementById('ultima-actualizacion').textContent = 'Actualizando...';

    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/visitas?select=*&order=created_at.desc', {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      });

      if (!res.ok) throw new Error('Error al cargar');
      const visitas = await res.json();

      renderMetricas(visitas);
      renderMapa(visitas);
      renderGobierno(visitas);
      renderProblemas(visitas);
      renderReportes(visitas);
      renderTabla(visitas);

      const ahora = new Date().toLocaleTimeString('es-MX');
      document.getElementById('ultima-actualizacion').textContent = 'Actualizado ' + ahora;

    } catch(e) {
      document.getElementById('ultima-actualizacion').textContent = 'Error al cargar datos';
    }
  }

  function renderMetricas(visitas) {
    const total = visitas.length;
    const bien = visitas.filter(v => v.gobierno === 'bien').length;
    const mal = visitas.filter(v => v.gobierno === 'mal').length;
    const reportes = visitas.filter(v => v.reporte && v.reporte.trim() !== '').length;

    document.getElementById('m-total').textContent = total;
    document.getElementById('m-bien').textContent = bien + (total ? ' (' + Math.round(bien/total*100) + '%)' : '');
    document.getElementById('m-mal').textContent = mal + (total ? ' (' + Math.round(mal/total*100) + '%)' : '');
    document.getElementById('m-reportes').textContent = reportes;
  }

  function renderMapa(visitas) {
    marcadores.forEach(function(m) { map.removeLayer(m); });
    marcadores = [];
    const colores = { bien:'#1D9E75', regular:'#e67e22', mal:'#e74c3c', noopina:'#95a5a6', '':'#95a5a6' };
    visitas.forEach(function(v) {
      if (!v.lat || !v.lng) return;
      const m = L.circleMarker([v.lat, v.lng], {
        color: colores[v.gobierno] || '#95a5a6',
        fillColor: colores[v.gobierno] || '#95a5a6',
        fillOpacity: 0.9, radius: 7, weight: 2
      }).addTo(map);
      m.bindPopup('<b>Gobierno:</b> ' + (v.gobierno || '—') + '<br><b>Agua:</b> ' + (v.agua || '—') + '<br><b>Calles:</b> ' + (v.calles || '—') + (v.reporte ? '<br><b>Reporte:</b> ' + v.reporte : ''));
      marcadores.push(m);
    });
  }

  function barra(label, valor, total, clase) {
    const pct = total ? Math.round(valor/total*100) : 0;
    return '<div class="barra-item">' +
      '<div class="barra-label"><span>' + label + '</span><span>' + valor + ' (' + pct + '%)</span></div>' +
      '<div class="barra-wrap"><div class="barra-fill ' + clase + '" style="width:' + pct + '%"></div></div>' +
      '</div>';
  }

  function renderGobierno(visitas) {
    const total = visitas.length;
    const bien = visitas.filter(v => v.gobierno === 'bien').length;
    const regular = visitas.filter(v => v.gobierno === 'regular').length;
    const mal = visitas.filter(v => v.gobierno === 'mal').length;
    const noopina = visitas.filter(v => v.gobierno === 'noopina').length;
    document.getElementById('barras-gobierno').innerHTML =
      barra('Bien', bien, total, 'fill-verde') +
      barra('Regular', regular, total, 'fill-naranja') +
      barra('Mal', mal, total, 'fill-rojo') +
      barra('No opina', noopina, total, 'fill-gris');
  }

  function renderProblemas(visitas) {
    const total = visitas.length;
    const agua = visitas.filter(v => v.agua === 'malo' || v.agua === 'regular').length;
    const calles = visitas.filter(v => v.calles === 'malo' || v.calles === 'regular').length;
    const alumbrado = visitas.filter(v => v.alumbrado === 'malo' || v.alumbrado === 'regular').length;
    document.getElementById('barras-problemas').innerHTML =
      barra('Agua / drenaje', agua, total, 'fill-agua') +
      barra('Calles / baches', calles, total, 'fill-calles') +
      barra('Alumbrado', alumbrado, total, 'fill-alumbrado');
  }

  function renderReportes(visitas) {
    const conReporte = visitas.filter(v => v.reporte && v.reporte.trim() !== '');
    const el = document.getElementById('lista-reportes');
    if (conReporte.length === 0) {
      el.innerHTML = '<p class="sin-reportes">Sin reportes por ahora</p>';
      return;
    }
    el.innerHTML = conReporte.map(function(v) {
      const hora = v.created_at ? new Date(v.created_at).toLocaleTimeString('es-MX') : '';
      return '<div class="reporte-item">' + v.reporte + '<div class="reporte-hora">' + hora + '</div></div>';
    }).join('');
  }

  function badgeGobierno(g) {
    const map = { bien:'badge-bien', regular:'badge-regular', mal:'badge-mal', noopina:'badge-noopina' };
    return '<span class="badge ' + (map[g] || 'badge-vacio') + '">' + (g || '—') + '</span>';
  }

  function renderTabla(visitas) {
    const tbody = document.getElementById('tabla-visitas');
    if (visitas.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#aaa;padding:20px;">Sin visitas aún</td></tr>';
      return;
    }
    tbody.innerHTML = visitas.slice(0, 20).map(function(v) {
      const hora = v.created_at ? new Date(v.created_at).toLocaleTimeString('es-MX') : '—';
      return '<tr><td>' + hora + '</td><td>' + badgeGobierno(v.gobierno) + '</td><td>' + (v.agua || '—') + '</td><td>' + (v.calles || '—') + '</td></tr>';
    }).join('');
  }

  // Cargar al inicio y cada 30 segundos
  cargarDatos();
  setInterval(cargarDatos, 30000);

</script>
</body>
</html>
